name: Build Debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleFreeDynamicDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-debug-apk
          path: lemuroid-app/build/outputs/apk/freeDynamic/debug/*.apk

      - name: Publish APK as rolling pre-release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest lemuroid-app/build/outputs/apk/freeDynamic/debug/*.apk \
            --prerelease \
            --title "Debug build (${GITHUB_SHA::7})" \
            --notes "APK de prueba generado automáticamente desde ${GITHUB_SHA}."
